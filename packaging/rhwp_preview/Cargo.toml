[package]
name = "rhwp-preview"
version = "0.1.0"
edition = "2021"
description = "Minimal HWP/HWPX preview renderer for M-Dir powered by rhwp"

[dependencies]
rhwp = { path = "../../../rhwp", default-features = false }
resvg = { version = "0.47", default-features = false, features = ["text", "raster-images"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[patch.crates-io]
ureq = { path = "ureq_stub" }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
